<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dog Survey</title>
        <link rel="stylesheet" href="survey.css">
    </head>

    <body>
        <h1>Tell Us About Dogs</h1>

        <div class="survey">
            <form action="#" method="post">
                <table>
                    <tr>
                        <td class="label">What do you value most in a dog?</td>
                        <td>
                            <div class="options">
                                <label>
                                    <input type="radio" name="best-thing" value="nature">
                                    Their loving personality
                                </label>
                                <label>
                                    <input type="radio" name="best-thing" value="security">
                                    How well they guard the home
                                </label>
                                <label>
                                    <input type="radio" name="best-thing" value="nothing">
                                    Honestly, nothing at all
                                </label>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td class="label">
                            <label for="breed">Which breed appeals to you most?</label>
                        </td>
                        <td>
                            <select id="breed" name="breed">
                                <option value="none">No preference</option>
                                <option value="labrador">Labrador</option>
                                <option value="german-shepherd">German Shepherd</option>
                                <option value="collie">Collie</option>
                                <option value="poodle">Poodle</option>
                                <option value="other">Other</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td class="label">
                            <label for="other-breed">If you picked Other, name the breed</label>
                        </td>
                        <td>
                            <input type="text" id="other-breed" name="other-breed">
                        </td>
                    </tr>

                    <tr>
                        <td class="label">
                            <label for="owns-dog">Do you live with a dog right now?</label>
                        </td>
                        <td>
                            <input type="checkbox" id="owns-dog" name="owns-dog">
                        </td>
                    </tr>

                    <tr>
                        <td class="label">
                            <label for="story">Share a dog story we should hear</label>
                        </td>
                        <td>
                            <textarea id="story" name="story"></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td class="label"></td>
                        <td>
                            <input type="submit" class="send" value="Send my answers">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </body>
</html>
